name: MDEditor
options:
  bundleIdPrefix: local.mdeditor
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO
targets:
  MDEditor:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Resources/vditor
        type: folder
        buildPhase: resources
      - path: Resources/web
        type: folder
        buildPhase: resources
      - path: Resources/Assets.xcassets
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_NAME: "LilaMD"
        PRODUCT_BUNDLE_IDENTIFIER: local.mdeditor.MDEditor
        PRODUCT_MODULE_NAME: MDEditor
        ENABLE_APP_SANDBOX: NO
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        INFOPLIST_PREPROCESS: YES
        INFOPLIST_PREFIX_HEADER: $(DERIVED_FILE_DIR)/mde_git_commit.h
    preBuildScripts:
      - name: Git commit for Info.plist
        basedOnDependencyAnalysis: false
        # Written before Info.plist is processed; INFOPLIST_PREPROCESS replaces MDE_GIT_COMMIT with it,
        # so the value is in the plist before code signing.
        outputFiles:
          - $(DERIVED_FILE_DIR)/mde_git_commit.h
        script: |
          COMMIT="$(git -C "$SRCROOT" rev-parse --short HEAD 2>/dev/null || echo unknown)"
          if [ -n "$(git -C "$SRCROOT" status --porcelain 2>/dev/null)" ]; then COMMIT="$COMMIT-dirty"; fi
          mkdir -p "$DERIVED_FILE_DIR"
          echo "#define MDE_GIT_COMMIT $COMMIT" > "$DERIVED_FILE_DIR/mde_git_commit.h"
          echo "MDEGitCommit=$COMMIT"
    info:
      path: Info.plist
      properties:
        MDEGitCommit: MDE_GIT_COMMIT
        CFBundleDisplayName: LilaMD
        CFBundleName: LilaMD
        CFBundleIconName: AppIcon
        CFBundleIconFile: AppIcon
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSApplicationCategoryType: public.app-category.productivity
        NSHumanReadableCopyright: ""
        CFBundleDocumentTypes:
          - CFBundleTypeName: Markdown Document
            CFBundleTypeRole: Editor
            LSHandlerRank: Default
            LSItemContentTypes: [net.daringfireball.markdown]
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: net.daringfireball.markdown
            UTTypeDescription: Markdown Document
            UTTypeConformsTo: [public.plain-text]
            UTTypeTagSpecification:
              public.filename-extension: [md, markdown]
              public.mime-type: [text/markdown]
  MDEditorTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: MDEditor
    settings:
      base:
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/LilaMD.app/Contents/MacOS/LilaMD"
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: local.mdeditor.MDEditorTests
        MDEDITOR_SAMPLES: "$(SRCROOT)/samples"
schemes:
  MDEditor:
    build:
      targets:
        MDEditor: all
        MDEditorTests: [test]
    test:
      config: Debug
      targets: [MDEditorTests]
      environmentVariables:
        MDEDITOR_SAMPLES: "$(SRCROOT)/samples"
